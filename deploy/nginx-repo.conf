# /etc/nginx/conf.d/blueberry-repo.conf
# Serve the Blueberry package repo built by blueberry-repo-sync.
# The repo lives under <OUT>/.. so http://<host>/x86_64/ holds the packages.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Parent of OUT (=/var/www/html/x86_64), so /x86_64/ serves the repo.
    root /var/www/html;
    autoindex on;                            # browsable package listing

    # Packages are content-addressed by version in the filename — cache forever.
    location ~ \.pkg\.tar\.zst$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The index changes on every rebuild — never cache it.
    location ~ /bpm\.index$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
