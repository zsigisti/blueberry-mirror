# /etc/nginx/conf.d/blueberry-mirror.conf
# Serve a Blueberry package mirror (the directory bpm-mirror-sync writes to).

server {
    listen 80;
    listen [::]:80;
    server_name mirror.blueberry.lan _;     # set to this mirror's hostname

    root /srv/blueberry-mirror;
    autoindex on;                            # browsable package listing

    # Packages are content-addressed by version in the filename — cache forever.
    location ~ \.pkg\.tar\.zst$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The index changes on every sync — never cache it.
    location = /bpm.index {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
